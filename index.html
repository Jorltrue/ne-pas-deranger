<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ne pas déranger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Mise en page : écran du logiciel de réception — barre de titre, modules à gauche, contenu au centre, missions à droite */
:root{
  --nuit:#14213d; --nuit-2:#22335b; --nuit-3:#31477a;
  --laiton:#b8873b; --laiton-2:#f6ecda; --laiton-3:#8a6326;
  --fond:#eceff4; --carte:#ffffff; --encre:#17202d; --encre-2:#4f5d6d; --trait:#d3dae3; --gris:#f4f6f9;
  --sarcelle:#0b6a62; --sarcelle-2:#dff0ed;
  --ok:#17723f; --ok-2:#e2f3e8; --alerte:#995000; --alerte-2:#fdf0da; --rouge:#b3261e; --rouge-2:#fbe8e6; --bleu:#1d4e98; --bleu-2:#e3ebf8;
  --porte:#a3201b; --postit:#ffe98a;
  --f-ui:"Barlow Semi Condensed", Bahnschrift, "Segoe UI", system-ui, sans-serif;
  --f-txt:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-hotel:"Cormorant Garamond", Georgia, Cambria, "Times New Roman", serif;
  --f-main:"Segoe Print", "Ink Free", "Bradley Hand", "Comic Sans MS", cursive;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--fond);color:var(--encre);font-family:var(--f-txt);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--laiton);outline-offset:2px}
h1,h2,h3{font-family:var(--f-ui);line-height:1.1;text-wrap:balance;margin:0}
p{margin:0}
.gutter{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#app{min-height:100%;display:flex;flex-direction:column}
#app > section, #app > .shell{flex:1}
.btn{border:0;border-radius:8px;padding:10px 16px;font-family:var(--f-ui);font-weight:700;font-size:17px;letter-spacing:.02em;background:var(--sarcelle);color:#fff}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--carte);color:var(--sarcelle);box-shadow:inset 0 0 0 2px var(--sarcelle)}
.btn.petit{padding:6px 12px;font-size:15px}
.btn.laiton{background:var(--laiton);color:#1b1305}
.lien{background:none;border:0;padding:0;color:var(--sarcelle);text-decoration:underline;font-weight:600}
.muted{color:var(--encre-2)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-family:var(--f-ui);font-weight:700;font-size:14px;letter-spacing:.03em;white-space:nowrap}

/* ---------- Écran d'accueil ---------- */
.accueil{display:grid;place-items:center;padding-block:32px;background:
  radial-gradient(1200px 500px at 50% -10%, var(--nuit-3), transparent 70%), var(--nuit);color:#fff}
.accueil-in{width:100%;max-width:980px;display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:48px;align-items:center}
.pancarte{position:relative;width:100%;max-width:260px;aspect-ratio:9/22;margin-inline:auto;border-radius:22px;background:var(--porte);
  box-shadow:0 30px 60px rgba(0,0,0,.45), inset 0 0 0 6px rgba(255,255,255,.08);transform-origin:50% 8%;animation:balance 3.2s ease-in-out 1 both;
  display:flex;flex-direction:column;align-items:center;padding:34% 18px 22px;text-align:center;color:#fff}
.pancarte::before{content:"";position:absolute;top:7%;left:50%;width:42%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:var(--nuit);box-shadow:inset 0 4px 10px rgba(0,0,0,.5)}
.pancarte::after{content:"";position:absolute;top:calc(7% + 21% - 2px);left:50%;width:14px;height:24%;transform:translateX(-50%);background:var(--nuit)}
.pancarte .p1{font-family:var(--f-ui);font-weight:800;font-size:44px;line-height:.92;letter-spacing:.01em;margin-top:18%}
.pancarte .p2{font-family:var(--f-ui);font-weight:600;font-size:14px;letter-spacing:.18em;text-transform:uppercase;opacity:.85;margin-top:14px}
.pancarte .p3{margin-top:auto;font-family:var(--f-hotel);font-size:20px;font-style:italic;opacity:.9}
@keyframes balance{0%{transform:rotate(-9deg)}25%{transform:rotate(6deg)}50%{transform:rotate(-3deg)}75%{transform:rotate(1.5deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion: reduce){.pancarte{animation:none}}
.accueil h1{font-size:clamp(34px,5vw,56px);font-weight:800;letter-spacing:.01em}
.accueil .sur{font-family:var(--f-ui);font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--laiton);font-size:15px;margin-bottom:10px}
.accueil .intro{margin-top:14px;font-size:18px;max-width:58ch;color:#dfe5f1}
.brigades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:26px}
.brigade{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;border-radius:14px;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff}
.brigade svg{width:40px;height:40px}
.brigade b{font-family:var(--f-ui);font-size:20px;letter-spacing:.02em}
.brigade small{opacity:.75;font-size:13px}
.brigade[aria-pressed="true"]{border-color:var(--laiton);background:rgba(184,135,59,.18)}
.accueil-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.accueil-actions .btn.sec{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.accueil-pied{margin-top:26px;font-size:14px;color:#aab6cc}
.accueil-pied .lien{color:#cfd8e8}
@media (max-width:760px){.accueil-in{grid-template-columns:minmax(0,1fr);gap:28px}.pancarte{max-width:180px}.pancarte .p1{font-size:32px}.brigades{grid-template-columns:minmax(0,1fr)}.brigade{flex-direction:row;justify-content:flex-start}}

/* ---------- Connexion ---------- */
.connexion{display:grid;place-items:center;padding-block:32px;background:linear-gradient(160deg,#dfe6ef,#f6f8fb)}
.connexion-in{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;justify-content:center;max-width:900px;width:100%}
.login{width:100%;max-width:420px;background:var(--carte);border-radius:14px;box-shadow:0 20px 50px rgba(20,33,61,.18);overflow:hidden}
.login-tete{background:var(--nuit);color:#fff;padding:18px 22px;display:flex;align-items:center;gap:12px}
.logo{font-family:var(--f-ui);font-weight:800;letter-spacing:.14em;color:var(--laiton);font-size:20px}
.login-corps{padding:22px;display:grid;gap:14px}
.champ{display:grid;gap:6px}
.champ label{font-family:var(--f-ui);font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--encre-2)}
.champ input{border:2px solid var(--trait);border-radius:8px;padding:10px 12px;background:#fff;font-size:17px}
.champ input:focus{border-color:var(--sarcelle);outline:none}
.erreur{color:var(--rouge);font-weight:600}
.postit{width:240px;max-width:100%;background:var(--postit);padding:20px 18px 24px;transform:rotate(2.5deg);box-shadow:0 12px 24px rgba(0,0,0,.16);font-family:var(--f-main);font-size:17px;line-height:1.35;color:#3b3205}
.postit small{display:block;text-align:right;margin-top:10px}

/* ---------- Application ---------- */
.shell{display:flex;flex-direction:column}
.barre{background:var(--nuit);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--nuit)}
.barre-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.barre .hotel{font-family:var(--f-hotel);font-size:21px;font-weight:600}
.barre .etoiles{color:var(--laiton);letter-spacing:2px;font-size:14px}
.barre .esp{flex:1}
.barre .info{font-family:var(--f-ui);font-weight:600;font-size:16px;color:#d6deec;white-space:nowrap}
.barre .chrono{font-variant-numeric:tabular-nums;background:var(--nuit-2);padding:3px 10px;border-radius:6px}
.barre .chrono.fin{background:var(--rouge)}
.barre .score{background:var(--laiton);color:#1b1305;padding:3px 10px;border-radius:6px}
.travail{flex:1;display:grid;grid-template-columns:200px minmax(0,1fr) 370px;align-items:start}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);display:flex;flex-direction:column;gap:2px;padding:14px 10px;padding-left:max(10px, env(safe-area-inset-left, 0px))}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;border-radius:8px;padding:9px 10px;font-family:var(--f-ui);font-weight:600;font-size:17px;color:var(--encre)}
.nav button svg{width:20px;height:20px;flex:none;color:var(--encre-2)}
.nav button:hover{background:var(--carte)}
.nav button[aria-current="page"]{background:var(--carte);color:var(--sarcelle);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.nav button[aria-current="page"] svg{color:var(--sarcelle)}
.nav .verrou{margin-left:auto;font-size:12px;color:var(--alerte);font-weight:700}
.nav .sep{height:1px;background:var(--trait);margin:8px 6px}
.contenu{padding:18px;min-width:0;display:grid;gap:16px}
.carte{background:var(--carte);border-radius:12px;padding:18px 20px;box-shadow:0 1px 2px rgba(0,0,0,.06);min-width:0}
.carte h2{font-size:26px;font-weight:700}
.carte h3{font-size:19px;font-weight:700;margin-bottom:8px}
.titre-mod{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}
.titre-mod .muted{font-size:15px}
.grille-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--gris);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-family:var(--f-ui);font-size:30px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--encre-2);font-size:15px}
.alerte{display:flex;gap:12px;align-items:flex-start;background:var(--alerte-2);border-left:5px solid var(--alerte);border-radius:8px;padding:12px 14px}
.defile{overflow-x:auto}
.tab{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.tab th{font-family:var(--f-ui);font-weight:700;text-align:left;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--encre-2);border-bottom:2px solid var(--trait);padding:8px 10px;white-space:nowrap}
.tab td{border-bottom:1px solid var(--trait);padding:8px 10px;vertical-align:top}
.tab tr.etage td{background:var(--gris);font-family:var(--f-ui);font-weight:700;color:var(--encre-2);letter-spacing:.04em;text-transform:uppercase;font-size:13px}
.tab tr.hl td{background:var(--laiton-2)}
.tab td.nom{white-space:nowrap}
.resa{display:inline-block;background:var(--bleu-2);color:var(--bleu);border-radius:6px;padding:1px 8px;font-weight:600;white-space:nowrap}
.statut{display:inline-block;min-width:38px;text-align:center;border-radius:6px;padding:1px 8px;font-family:var(--f-ui);font-weight:800;font-size:14px;letter-spacing:.04em}
.st-O{background:var(--bleu-2);color:var(--bleu)} .st-LP{background:var(--ok-2);color:var(--ok)} .st-LS{background:var(--alerte-2);color:var(--alerte)} .st-HS{background:var(--rouge-2);color:var(--rouge)}
.legende{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:15px;margin-top:10px}
.legende span{display:inline-flex;align-items:center;gap:6px}
.note{margin-top:10px;font-size:15px;color:var(--encre-2)}
.fiche{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;font-size:15px}
.dl dt{color:var(--encre-2);font-weight:600}
.dl dd{margin:0}
.client-liste{display:grid;gap:8px}
.client-ligne{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--trait);background:var(--carte);border-radius:10px;padding:10px 12px}
.client-ligne:hover{border-color:var(--sarcelle)}
.client-ligne .num{font-family:var(--f-ui);font-weight:800;font-size:20px;color:var(--sarcelle)}
.mc{display:grid;gap:10px}
.mc-ligne{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;padding:10px 12px;border-radius:10px;background:var(--gris)}
.mc-ligne .quand{font-family:var(--f-ui);font-weight:700;color:var(--encre-2);font-variant-numeric:tabular-nums}
.mc-ligne .qui{font-family:var(--f-ui);font-weight:700;font-size:15px;color:var(--sarcelle);margin-bottom:2px}
.msg{border:1px solid var(--trait);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.msg .entete{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--encre-2)}
.msg .objet{font-family:var(--f-ui);font-weight:700;font-size:18px}
.verrouille{display:grid;place-items:center;text-align:center;gap:10px;padding:40px 20px;color:var(--encre-2)}
.verrouille svg{width:46px;height:46px;color:var(--alerte)}

/* ---------- Site Internet de l'hôtel (dans le logiciel) ---------- */
.navigateur{border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08);background:var(--carte)}
.nav-barre{display:flex;align-items:center;gap:10px;background:#dfe4ea;padding:8px 12px}
.nav-barre .pts{display:flex;gap:6px}.nav-barre .pts i{width:11px;height:11px;border-radius:50%;background:#b9c1cb;display:block}
.nav-barre .url{flex:1;min-width:0;background:#fff;border-radius:999px;padding:4px 14px;font-size:14px;color:var(--encre-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site{font-family:var(--f-txt);color:#1c2235;background:#fbfaf7}
.site-tete{background:var(--nuit);color:#f3ead9;padding:18px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.site-tete .nomh{font-family:var(--f-hotel);font-size:28px;font-weight:700;letter-spacing:.02em}
.site-tete .et{color:var(--laiton);letter-spacing:3px}
.site-menu{display:flex;flex-wrap:wrap;gap:4px}
.site-menu button{border:0;background:none;color:#e9dfcb;padding:6px 10px;border-radius:6px;font-family:var(--f-txt);font-weight:600;font-size:15px}
.site-menu button[aria-current="page"]{background:rgba(184,135,59,.28);color:#fff}
.site-corps{padding:24px 26px;display:grid;gap:16px}
.site h2{font-family:var(--f-hotel);font-size:34px;font-weight:700;color:var(--nuit)}
.site h3{font-family:var(--f-hotel);font-size:24px;font-weight:700;color:var(--nuit)}
.site .chapo{font-family:var(--f-hotel);font-size:22px;font-style:italic;color:#4a4f60;max-width:60ch}
.site-hero{border-radius:12px;padding:34px 28px;color:#fff;background:linear-gradient(135deg, rgba(20,33,61,.92), rgba(49,71,122,.85)), repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 22px)}
.site-hero p{max-width:52ch;font-size:18px;margin-top:10px;color:#e8ecf5}
.site-trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.site-trio div{background:#fff;border:1px solid #e6e1d6;border-radius:10px;padding:16px}
.site-trio b{font-family:var(--f-hotel);font-size:22px;color:var(--nuit);display:block}
.tarifs td,.tarifs th{white-space:normal}
.tarifs td.prix{font-family:var(--f-ui);font-weight:700;font-size:18px;white-space:nowrap}
.frise-site{display:grid;gap:10px}
.frise-site div{display:grid;grid-template-columns:70px minmax(0,1fr);gap:14px;align-items:baseline}
.frise-site b{font-family:var(--f-hotel);font-size:26px;color:var(--laiton-3)}
.horaires{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.horaires div{background:#fff;border:1px solid #e6e1d6;border-radius:10px;padding:12px 14px}
.horaires b{display:block;font-family:var(--f-ui);font-size:17px;color:var(--nuit)}

/* ---------- Panneau des missions ---------- */
.missions{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);max-height:calc(100vh - 60px);overflow:auto;padding:16px 16px 24px;padding-right:max(16px, env(safe-area-inset-right, 0px));display:grid;gap:12px;align-content:start}
.mis-tete{display:flex;align-items:center;gap:10px}
.mis-tete h2{font-size:24px}
.progres{height:8px;border-radius:999px;background:var(--trait);overflow:hidden}
.progres i{display:block;height:100%;background:var(--laiton)}
.mission{background:var(--carte);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.06);overflow:hidden;border:2px solid transparent}
.mission.active{border-color:var(--laiton)}
.mission.faite{opacity:.92}
.mission summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.mission summary::-webkit-details-marker{display:none}
.mission .rond{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-ui);font-weight:800;background:var(--gris);color:var(--encre-2)}
.mission.faite .rond{background:var(--ok);color:#fff}
.mission.active .rond{background:var(--laiton);color:#1b1305}
.mission .mt{font-family:var(--f-ui);font-weight:700;font-size:18px;line-height:1.15}
.mission .mp{margin-left:auto;font-size:13px;color:var(--encre-2);white-space:nowrap}
.mission .corps{padding:0 14px 14px;display:grid;gap:12px}
.mission .consigne{font-size:15px;color:var(--encre-2)}
.item{display:grid;gap:6px;padding:10px;border-radius:10px;background:var(--gris)}
.item label,.item .q{font-weight:600;font-size:15px}
.item .rang{display:flex;gap:8px}
.item input[type=text]{flex:1;min-width:0;border:2px solid var(--trait);border-radius:8px;padding:8px 10px;background:#fff}
.item input[type=text]:focus{border-color:var(--sarcelle);outline:none}
.item.ok{background:var(--ok-2)}
.item.ok .valeur{font-weight:700;color:var(--ok)}
.item .retour{font-size:14px;font-weight:600}
.item .retour.non{color:var(--rouge)}
.qcm{display:grid;gap:6px}
.qcm label{display:flex;gap:8px;align-items:flex-start;font-weight:400;background:#fff;border:1px solid var(--trait);border-radius:8px;padding:7px 10px;cursor:pointer}
.qcm input{margin-top:4px}
.indices{display:grid;gap:6px}
.indice{background:var(--laiton-2);border-radius:8px;padding:8px 10px;font-size:15px}
.mis-pied{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;font-size:14px;color:var(--encre-2);padding-top:4px}

.frag{border-radius:12px;padding:16px 18px;background:var(--nuit);color:#fff;display:grid;gap:8px}
.frag-eyebrow{font-family:var(--f-ui);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--laiton);font-size:14px}
.frag-big{font-family:var(--f-ui);font-weight:800;font-size:24px;line-height:1.1}
.frag-todo{background:rgba(255,255,255,.1);border-radius:8px;padding:8px 10px}

/* ---------- Rapport final ---------- */
.rapport{max-width:760px}
.rapport-form{display:grid;gap:14px;margin-top:14px}
.rapport-form .champ input{font-size:18px}
.resultat-final{margin-top:8px;border-radius:14px;padding:22px;background:var(--nuit);color:#fff;display:grid;gap:10px;text-align:center}
.final-eyebrow{font-family:var(--f-ui);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--laiton)}
.final-title{font-size:40px;font-weight:800}
.final-code{display:flex;justify-content:center;gap:10px;margin:8px 0}
.final-code span{width:62px;height:78px;display:grid;place-items:center;border-radius:10px;background:#0d1730;box-shadow:inset 0 0 0 2px var(--laiton);font-family:var(--f-ui);font-weight:800;font-size:46px;color:#ffd98e}
.final-small{color:#c9d2e3}
.champ-retour{font-size:14px;font-weight:700}
.champ-retour.ok{color:var(--ok)} .champ-retour.non{color:var(--rouge)}

/* ---------- Fenêtre, toast ---------- */
.modal{position:fixed;inset:0;background:rgba(10,16,30,.55);display:grid;place-items:center;z-index:20;padding:20px}

function sansAccents(s){ return String(s == null ? "" : s).trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function norme(valeur, type){
  const s = sansAccents(valeur);
  if (type === "txt") return s.replace(/[^a-z0-9]/g, "");
  if (type === "num") { const d = s.replace(/[^0-9]/g, ""); return d.replace(/^0+(?=\d)/, ""); }
  if (type === "prix") { const t = s.replace(/[^0-9,.]/g, "").replace(",", "."); const v = parseFloat(t); if (isNaN(v)) return ""; return Number.isInteger(v) ? String(v) : v.toFixed(2); }
  if (type === "heure") { let d = s.replace(/[^0-9]/g, ""); if (!d) return ""; if (d.length <= 2) d = d.padStart(2, "0") + "00"; else if (d.length === 3) d = "0" + d; return d.slice(0, 4); }
  if (type === "heureH") { let d = s.replace(/[^0-9]/g, ""); if (d.length === 4 && d.endsWith("00")) d = d.slice(0, 2); if (d.length === 1) d = "0" + d; return d; }
  return s;
}

function ding(ok){
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = "sine"; o.frequency.value = ok ? 880 : 220; g.gain.value = 0.06;
    o.connect(g); g.connect(audio.destination); o.start();
    if (ok) o.frequency.setValueAtTime(1320, audio.currentTime + 0.12);
    o.stop(audio.currentTime + (ok ? 0.28 : 0.2));
  } catch (e) {}
}

function panneauMissions(){
  const principales = MISSIONS.filter(m => !m.bonus);
  const faites = principales.filter(m => missionFaite(m, E)).length;
  const active = vue.missionOuverte || (principales.find(m => !missionFaite(m, E) && missionDispo(m, E)) || {}).id;
  let html = `<div class="mis-tete"><h2>Missions</h2><span class="muted">${faites} / ${principales.length}</span></div>
    <div class="progres" aria-hidden="true"><i style="width:${Math.round(100 * faites / principales.length)}%"></i></div>`;
  if (E.faits.M6a && E.faits.M6b){
    let frag = "";
    try { frag = dechiffrer(SECRETS.enc.fragOu, E.valeurs.M5 || ""); } catch (e) {}
    html += frag;
  }
  MISSIONS.forEach((m, i) => {
    if (m.bonus && !missionDispo(m, E)) return;
    const faite = missionFaite(m, E), dispo = missionDispo(m, E);
    const pts = m.connexion ? 2 : m.papier ? 6 : (m.items || []).reduce((a, it) => a + it.pts, 0);
    const ouvert = m.id === active;
    const num = m.bonus ? "+" : String(i + 1);
    html += `<details class="mission ${faite ? "faite" : ""} ${ouvert && !faite ? "active" : ""}" data-mission="${m.id}" ${ouvert ? "open" : ""}>
      <summary><span class="rond">${faite ? "✓" : num}</span><span class="mt">${esc(m.titre)}</span><span class="mp">${m.papier ? "papier · " : ""}${pts} pts</span></summary>
      <div class="corps">${corpsMission(m, dispo, faite)}</div></details>`;
  });
  html += `<div class="mis-pied"><span>Coups de pouce utilisés : ${nbIndices(E)} (−1 point chacun)</span><span>Bonus : ${pointsBonus(E)} pts</span></div>`;
  return html;
}
function corpsMission(m, dispo, faite){
  if (!dispo) return `<p class="consigne">${m.besoin ? "Se débloque après la mission " + m.besoin.slice(1) + "." : "Connectez-vous d'abord."}</p>`;
  let html = `<p class="consigne">${esc(m.consigne || "")}</p>`;
  if (m.connexion) return html + `<p class="item ok"><span class="valeur">Connecté au logiciel ✓</span></p>`;
  if (m.papier) return html + `<div class="qcm"><label><input type="checkbox" id="m7" ${E.papierM7 ? "checked" : ""}> <span>Nous avons rempli le tableau sur la fiche papier.</span></label></div>`;
  (m.items || []).forEach(it => {
    if (E.faits[it.id]){ html += `<div class="item ok"><span class="q">${esc(it.q)}</span><span class="valeur">✓ ${esc(E.valeurs[it.id + "_aff"] || "")}</span></div>`; return; }
    const essais = E.essais[it.id] || 0;
    const retour = essais ? `<span class="retour non">Ce n'est pas ça (${essais} essai${essais > 1 ? "s" : ""}). Relisez bien !</span>` : "";
    if (it.type === "qcm"){
      html += `<form class="item" data-item="${it.id}"><span class="q">${esc(it.q)}</span><div class="qcm">${it.choix.map(([v, t]) => `<label><input type="radio" name="${it.id}" value="${v}"> <span>${esc(t)}</span></label>`).join("")}</div>${retour}<button class="btn petit" type="submit">Valider</button></form>`;
    } else {
      html += `<form class="item" data-item="${it.id}" autocomplete="off"><label for="in-${it.id}">${esc(it.q)}</label><div class="rang"><input type="text" id="in-${it.id}" placeholder="${esc(it.aide || "")}" spellcheck="false"><button class="btn petit" type="submit">Valider</button></div>${retour}</form>`;
    }
  });
  if (m.indices && !faite){
    const vus = E.indices[m.id] || 0;
    html += `<div class="indices">${m.indices.slice(0, vus).map(t => `<p class="indice">${esc(t)}</p>`).join("")}</div>`;
    if (vus < m.indices.length) html += `<button class="lien" data-indice="${m.id}">Coup de pouce (−1 point)</button>`;
  }
  return html;
}

    else { E.essais.M1 = (E.essais.M1 || 0) + 1; sauver(); ding(false); vue.erreurLogin = "Mot de passe incorrect. Lisez le post-it et cherchez sur Internet."; afficher(); const i = $("#login-mdp"); if (i) i.focus(); }
  });

  document.querySelectorAll("[data-module]").forEach(b => b.addEventListener("click", () => { vue.module = b.dataset.module; vue.client = null; afficher(); window.scrollTo(0, 0); }));
  document.querySelectorAll("[data-page]").forEach(b => b.addEventListener("click", () => { vue.page = b.dataset.page; afficher(); }));

  document.querySelectorAll("[data-indice]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.indice; E.indices[id] = (E.indices[id] || 0) + 1; vue.missionOuverte = id === "M1" ? null : id; sauver(); afficher();
  }));

  const fr = $("#form-rapport"); if (fr) fr.addEventListener("submit", ev => { ev.preventDefault(); validerRapport(); });
}

function validerItem(form){
  const id = form.dataset.item, it = ITEMS[id];
  let brut = "", aff = "";
  if (it.type === "qcm"){
    const c = form.querySelector("input:checked");
    if (!c){ toast("Choisissez une réponse"); return; }
    brut = c.value; aff = it.choix.find(x => x[0] === brut)[1];
  } else {
    aff = form.querySelector("input").value.trim();
    if (!aff){ toast("Écrivez une réponse"); return; }
    brut = norme(aff, it.type);
  }
  vue.missionOuverte = it.mission;
  if (bonneReponse(id, brut)){
    E.faits[id] = true; E.valeurs[id] = brut; E.valeurs[id + "_aff"] = aff; sauver(); ding(true);
    toast(`Bonne réponse : +${it.pts} point${it.pts > 1 ? "s" : ""}`);
    const m = MISSIONS.find(x => x.id === it.mission);
    if (missionFaite(m, E)){
      vue.missionOuverte = null;
      if (m.id === "M4") toast("Mission réussie : la messagerie est ouverte !");
      if (m.id === "M5") toast("Bravo ! Le journal des portes est ouvert.");
      if (m.id === "M6") toast("Fragment trouvé : notez-le dans votre carnet !");
    }
  } else {
    E.essais[id] = (E.essais[id] || 0) + 1; sauver(); ding(false);
  }
  afficher();
}

function candidatsQui(v){
  const s = norme(v, "txt"), out = new Set([s]);
  ["monsieur", "mr", "m"].forEach(p => { if (s.startsWith(p)) out.add(s.slice(p.length)); });
  Array.from(out).forEach(x => ["paul", "p"].forEach(p => { if (x.startsWith(p)) out.add(x.slice(p.length)); }));
  return Array.from(out).filter(Boolean);
}
function validerRapport(){
  const qui = $("#r-qui").value, ou = norme($("#r-ou").value, "num"), quand = norme($("#r-quand").value, "heureH"), lieu = norme($("#r-lieu").value, "txt");
  const quiOk = candidatsQui(qui).find(c => H(SEL + "|F-qui|" + c) === SECRETS.champ.qui);
  const ouOk = H(SEL + "|F-ou|" + ou) === SECRETS.champ.ou;
  const quandOk = H(SEL + "|F-quand|" + quand) === SECRETS.champ.quand;
  const lieuOk = /bar|salonbleu/.test(lieu);
  E.finalEssais += 1;
  const marque = (sel, ok) => { const el = $(sel); el.textContent = ok ? "✓ Juste" : "✗ Pas encore"; el.className = "champ-retour " + (ok ? "ok" : "non"); };
  if (quiOk && ouOk && quandOk && lieuOk){
    const cle = quiOk + "|" + ou + "|" + quand;
    if (H(SEL + "|final|" + cle) === SECRETS.final){
      const d = new Date();
      E.final = { ok:true, cle, heure: d.toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit", second:"2-digit" }) };
      sauver(); ding(true); afficher(); return;
    }
  }
  sauver(); ding(false);
  marque("#rr-qui", !!quiOk); marque("#rr-ou", ouOk); marque("#rr-quand", quandOk); marque("#rr-lieu", lieuOk);
  toast("Rapport refusé : corrigez les lignes marquées");
}

/* ================= Chronomètre ================= */
function majChrono(){
  const el = $("#chrono"); if (!el || !E || !E.debut) return;
  const reste = Math.round((tout.reglages.duree * 60000 - (Date.now() - E.debut)) / 1000);
  if (reste <= 0){ el.textContent = "Temps écoulé"; el.classList.add("fin"); return; }
  el.textContent = String(Math.floor(reste / 60)).padStart(2, "0") + ":" + String(reste % 60).padStart(2, "0");
  el.classList.toggle("fin", reste < 300);
}
setInterval(majChrono, 1000);

/* ================= Espace professeur ================= */
function fermerModal(){ $("#modal").hidden = true; }
function ouvrirProf(){
  const box = $("#modal-box");
  box.innerHTML = `<h2 id="modal-titre">Espace professeur</h2>
    <form id="form-pin" class="champ" autocomplete="off"><label for="pin">Code professeur</label><div style="display:flex;gap:8px"><input id="pin" type="password" inputmode="numeric" style="flex:1;border:2px solid var(--trait);border-radius:8px;padding:8px 10px"><button class="btn petit" type="submit">Entrer</button></div><span class="erreur" id="pin-err"></span></form>
    <button class="btn sec petit" id="fermer">Fermer</button>`;
  $("#modal").hidden = false; $("#pin").focus();
  $("#fermer").addEventListener("click", fermerModal);
  $("#form-pin").addEventListener("submit", ev => {
    ev.preventDefault();
    if (bonneReponse("PIN", norme($("#pin").value, "num"))) panneauProf(); else $("#pin-err").textContent = "Code incorrect.";
  });
}
function panneauProf(confirmer){
  const box = $("#modal-box");
  const lignes = Object.keys(BRIGADES).map(k => {
    const e = tout[k];
    if (!e) return `<tr><td>${BRIGADES[k].nom}</td><td colspan="5" class="muted">pas encore jouée sur cet ordinateur</td><td></td></tr>`;
    return `<tr><td>${BRIGADES[k].nom}</td><td><b>${points(e)}</b> / ${MAX_APP}</td><td>${pointsBonus(e)}</td><td>${nbIndices(e)}</td><td>${e.papierM7 ? "oui" : "non"}</td><td>${e.final && e.final.ok ? "validé à " + e.final.heure + " (" + e.finalEssais + " essai·s)" : e.finalEssais ? e.finalEssais + " essai·s" : "—"}</td><td><button class="lien" data-raz="${k}">Remettre à zéro</button></td></tr>`;
  }).join("");
  box.innerHTML = `<h2 id="modal-titre">Espace professeur</h2>
    <p class="muted">Scores enregistrés sur cet ordinateur. Points app sur ${MAX_APP} (+ mission 7 papier sur 6, à noter vous-même). Indices : −1 point chacun.</p>
    <div class="defile"><table class="tab prof-tab"><thead><tr><th>Brigade</th><th>Points</th><th>Bonus</th><th>Indices</th><th>M7 cochée</th><th>Rapport final</th><th></th></tr></thead><tbody>${lignes}</tbody></table></div>
    <div class="champ"><label for="duree">Durée de l'atelier</label><select id="duree" style="border:2px solid var(--trait);border-radius:8px;padding:8px">${[30, 35, 40, 45, 50].map(d => `<option value="${d}" ${tout.reglages.duree === d ? "selected" : ""}>${d} minutes</option>`).join("")}</select></div>
    ${confirmer ? `<div class="alerte"><div>Effacer la partie de la ${BRIGADES[confirmer].nom} sur cet ordinateur ?</div><div style="display:flex;gap:8px"><button class="btn petit" id="oui-raz">Oui, effacer</button><button class="btn petit sec" id="non-raz">Annuler</button></div></div>` : ""}
    <button class="btn sec petit" id="fermer">Fermer</button>`;
  $("#fermer").addEventListener("click", () => { fermerModal(); afficher(); });
  $("#duree").addEventListener("change", ev => { tout.reglages.duree = Number(ev.target.value); ecrireTout(tout); majChrono(); });
  box.querySelectorAll("[data-raz]").forEach(b => b.addEventListener("click", () => panneauProf(b.dataset.raz)));
  if (confirmer){
    $("#oui-raz").addEventListener("click", () => { delete tout[confirmer]; ecrireTout(tout); if (E && E.brigade === confirmer){ E = null; vue.ecran = "accueil"; vue.brigadeChoisie = null; } panneauProf(); });
    $("#non-raz").addEventListener("click", () => panneauProf());
  }
}
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !$("#modal").hidden) { fermerModal(); afficher(); } });

afficher();
</script>
