<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ne pas déranger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Mise en page : une seule colonne, une mission à la fois, gros caractères (élèves de CAP) */
:root{
  --nuit:#14213d; --nuit-2:#22335b; --laiton:#b8873b; --laiton-2:#f6ecda; --laiton-3:#8a6326;
  --fond:#eef1f5; --carte:#ffffff; --encre:#17202d; --encre-2:#4f5d6d; --trait:#d3dae3; --gris:#f4f6f9;
  --vert:#17723f; --vert-2:#e2f3e8; --rouge:#b3261e; --rouge-2:#fbe8e6; --bleu:#1d4e98; --bleu-2:#e3ebf8; --orange:#995000; --orange-2:#fdf0da;
  --porte:#a3201b; --postit:#ffe98a;
  --f-ui:"Barlow Semi Condensed", Bahnschrift, "Segoe UI", system-ui, sans-serif;
  --f-txt:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-hotel:"Cormorant Garamond", Georgia, Cambria, "Times New Roman", serif;
  --f-main:"Segoe Print", "Ink Free", "Bradley Hand", "Comic Sans MS", cursive;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--fond);color:var(--encre);font-family:var(--f-txt);font-size:19px;line-height:1.45}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--laiton);outline-offset:2px}
h1,h2,h3{font-family:var(--f-ui);line-height:1.1;text-wrap:balance;margin:0}
p{margin:0}
#app{min-height:100%;display:flex;flex-direction:column}
#app > section{flex:1}
.gutter{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.colonne{width:100%;max-width:860px;margin:0 auto;display:grid;gap:18px}
.btn{border:0;border-radius:10px;padding:12px 22px;font-family:var(--f-ui);font-weight:800;font-size:21px;letter-spacing:.02em;background:var(--vert);color:#fff}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.laiton{background:var(--laiton);color:#1b1305}
.btn.clair{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.btn.contour{background:var(--carte);color:var(--nuit);box-shadow:inset 0 0 0 2px var(--nuit)}
.btn.petit{padding:8px 14px;font-size:17px}
.lien{background:none;border:0;padding:0;color:inherit;text-decoration:underline;font-weight:600}
.carte{background:var(--carte);border-radius:16px;padding:22px 24px;box-shadow:0 1px 3px rgba(0,0,0,.07);min-width:0}

/* ---------- Accueil ---------- */
.accueil{display:grid;place-items:center;padding-block:28px;background:radial-gradient(1100px 480px at 50% -10%, #31477a, transparent 70%), var(--nuit);color:#fff}
.accueil-in{width:100%;max-width:960px;display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr);gap:44px;align-items:center}
.pancarte{position:relative;width:100%;max-width:230px;aspect-ratio:9/22;margin-inline:auto;border-radius:22px;background:var(--porte);box-shadow:0 30px 60px rgba(0,0,0,.45);transform-origin:50% 8%;animation:balance 3s ease-in-out 1 both;display:flex;flex-direction:column;align-items:center;padding:36% 14px 20px;text-align:center}
.pancarte::before{content:"";position:absolute;top:7%;left:50%;width:42%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:var(--nuit)}
.pancarte{padding-top:72%}
.pancarte b{font-family:var(--f-ui);font-weight:800;font-size:40px;line-height:.92}
.pancarte span{margin-top:auto;font-family:var(--f-hotel);font-style:italic;font-size:20px}
@keyframes balance{0%{transform:rotate(-9deg)}25%{transform:rotate(6deg)}50%{transform:rotate(-3deg)}75%{transform:rotate(1.5deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion: reduce){.pancarte{animation:none}}
.accueil h1{font-size:clamp(36px,5vw,54px);font-weight:800}
.accueil .sur{font-family:var(--f-ui);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--laiton);font-size:16px;margin-bottom:8px}
.accueil .intro{margin-top:12px;font-size:21px;color:#e3e8f2;max-width:42ch}
.choix-brigade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:24px}
.brigade{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border-radius:14px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff}
.brigade svg{width:42px;height:42px}
.brigade b{font-family:var(--f-ui);font-size:22px}
.brigade small{opacity:.75;font-size:14px}
.brigade[aria-pressed="true"]{border-color:var(--laiton);background:rgba(184,135,59,.22)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.pied-accueil{margin-top:22px;font-size:15px;color:#aab6cc}
@media (max-width:760px){.accueil-in{grid-template-columns:minmax(0,1fr);gap:24px}.pancarte{max-width:160px}.pancarte b{font-size:28px}.choix-brigade{grid-template-columns:minmax(0,1fr)}.brigade{flex-direction:row}}

/* ---------- Barre du haut ---------- */
.barre{background:var(--nuit);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--nuit)}
.barre-in{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px}
.barre .hotel{font-family:var(--f-hotel);font-size:22px;font-weight:700}
.barre .hotel i{color:var(--laiton);font-style:normal;letter-spacing:2px;font-size:14px}
.barre .esp{flex:1}
.barre .info{font-family:var(--f-ui);font-weight:700;font-size:18px;white-space:nowrap}
.barre .chrono{background:var(--nuit-2);padding:2px 10px;border-radius:6px;font-variant-numeric:tabular-nums}
.barre .chrono.fin{background:var(--rouge)}
.barre .pts{background:var(--laiton);color:#1b1305;padding:2px 10px;border-radius:6px}

/* ---------- Mission ---------- */
.page{padding-block:22px 40px}
.etapes{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.etapes span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-ui);font-weight:800;font-size:18px;background:var(--trait);color:var(--encre-2)}
.etapes span.faite{background:var(--vert);color:#fff}
.etapes span.ici{background:var(--laiton);color:#1b1305;box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--laiton)}
.etapes em{font-style:normal;font-family:var(--f-ui);font-weight:700;color:var(--encre-2);margin-left:6px}
.mission-titre{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.mission-titre .num{font-family:var(--f-ui);font-weight:800;font-size:18px;letter-spacing:.12em;text-transform:uppercase;color:var(--laiton-3)}
.mission-titre h1{font-size:36px;color:var(--nuit)}
.texte{font-size:21px;margin-top:8px}
.question{display:grid;gap:10px;padding:16px;border-radius:12px;background:var(--gris)}
.question.ok{background:var(--vert-2)}
.question .q{font-weight:700;font-size:20px}
.rang{display:flex;gap:10px;flex-wrap:wrap}
.rang input{flex:1;min-width:180px;border:3px solid var(--trait);border-radius:10px;padding:10px 14px;background:#fff;font-size:21px}
.rang input:focus{border-color:var(--vert);outline:none}
.qcm{display:grid;gap:8px}
.qcm label{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--trait);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:19px}
.qcm input{width:22px;height:22px}
.non{color:var(--rouge);font-weight:700}
.bravo-q{color:var(--vert);font-weight:800}
.aide-zone{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.aide{background:var(--laiton-2);border-radius:12px;padding:14px 16px;font-size:19px}
.bravo{background:var(--vert);color:#fff;border-radius:16px;padding:20px 24px;display:grid;gap:12px}
.bravo h2{font-size:30px}
.bravo .btn{background:#fff;color:var(--vert);justify-self:start}

/* ---------- Documents montrés dans les missions ---------- */
.postit{max-width:440px;background:var(--postit);padding:22px 22px 26px;transform:rotate(-1.5deg);box-shadow:0 12px 24px rgba(0,0,0,.15);font-family:var(--f-main);font-size:21px;line-height:1.4;color:#3b3205}
.postit small{display:block;text-align:right;margin-top:8px}
.chercher{display:grid;gap:10px}
.chercher a{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--encre);background:#fff;border:2px solid var(--trait);border-radius:12px;padding:12px 16px;font-size:19px}
.chercher a:hover{border-color:var(--bleu)}
.chercher a b{font-family:var(--f-ui);font-size:18px;color:#fff;background:var(--bleu);border-radius:8px;padding:4px 10px;white-space:nowrap}
.navigateur{border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.1);background:#fbfaf7}
.nav-barre{display:flex;align-items:center;gap:10px;background:#dfe4ea;padding:8px 12px}
.nav-barre i{width:11px;height:11px;border-radius:50%;background:#b9c1cb;display:block}
.nav-barre span{flex:1;min-width:0;background:#fff;border-radius:999px;padding:3px 14px;font-size:15px;color:var(--encre-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site-tete{background:var(--nuit);color:#f3ead9;padding:16px 20px}
.site-tete b{font-family:var(--f-hotel);font-size:30px}
.site-tete i{color:var(--laiton);font-style:normal;letter-spacing:3px}
.site-corps{padding:18px 20px;display:grid;gap:14px}
.faits{display:flex;flex-wrap:wrap;gap:8px}
.faits span{background:#fff;border:1px solid #e6e1d6;border-radius:999px;padding:4px 14px;font-size:17px}
.defile{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:18px;font-variant-numeric:tabular-nums}
th{font-family:var(--f-ui);font-weight:700;text-align:left;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--encre-2);border-bottom:2px solid var(--trait);padding:8px 10px;white-space:nowrap}
td{border-bottom:1px solid var(--trait);padding:9px 10px;vertical-align:top}
td.prix{font-family:var(--f-ui);font-weight:800;font-size:21px;white-space:nowrap}
tr.hl td{background:var(--laiton-2)}
.fiche{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 18px;font-size:19px}
.fiche dt{color:var(--encre-2);font-weight:600}
.fiche dd{margin:0}
.cahier{background:#fffdf4;border:2px solid #e9dfbf;border-radius:12px;padding:16px 18px;font-family:var(--f-main);color:#1f3a8a;font-size:19px;line-height:1.55}
.cahier small{display:block;font-family:var(--f-txt);color:var(--encre-2);font-size:15px;margin-bottom:4px}
.statut{display:inline-block;min-width:44px;text-align:center;border-radius:6px;padding:1px 8px;font-family:var(--f-ui);font-weight:800;font-size:16px}
.st-O{background:var(--bleu-2);color:var(--bleu)} .st-LP{background:var(--vert-2);color:var(--vert)} .st-HS{background:var(--rouge-2);color:var(--rouge)}
.legende{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:17px;margin-top:10px}
.memo{background:#fff;color:var(--encre);border-radius:12px;padding:14px 16px;font-size:18px}
.memo b{font-family:var(--f-ui)}
.frag{background:var(--nuit);color:#fff;border-radius:16px;padding:20px 24px;display:grid;gap:10px}
.frag-sur{font-family:var(--f-ui);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--laiton);font-size:16px}
.frag-gros{font-family:var(--f-ui);font-weight:800;font-size:30px;line-height:1.1}
.frag-note{background:rgba(255,255,255,.12);border-radius:10px;padding:10px 12px}

/* ---------- Rapport final ---------- */
.code{display:flex;justify-content:center;gap:10px;margin:6px 0}
.code span{width:64px;height:80px;display:grid;place-items:center;border-radius:10px;background:#0d1730;box-shadow:inset 0 0 0 2px var(--laiton);font-family:var(--f-ui);font-weight:800;font-size:48px;color:#ffd98e}
.final{background:var(--nuit);color:#fff;border-radius:16px;padding:24px;display:grid;gap:12px;text-align:center}
.final h2{font-size:40px}

/* ---------- Fenêtre, message ---------- */
.modal{position:fixed;inset:0;background:rgba(10,16,30,.55);display:grid;place-items:center;z-index:20;padding:20px}
.modal-box{width:100%;max-width:720px;max-height:90vh;overflow:auto;background:var(--carte);border-radius:16px;padding:22px;display:grid;gap:14px;font-size:17px}
.modal-box table{font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--vert);color:#fff;font-family:var(--f-ui);font-weight:800;font-size:22px;padding:12px 22px;border-radius:12px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.rouge{background:var(--rouge)}
@media (max-width:600px){body{font-size:18px}.mission-titre h1{font-size:30px}.fiche{grid-template-columns:minmax(0,1fr)}}
</style>

</head>

const K256 = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256(bytes){
  const l = bytes.length, total = Math.ceil((l + 9) / 64) * 64, m = new Uint8Array(total);
  m.set(bytes); m[l] = 0x80;
  const bits = l * 8, hi = Math.floor(bits / 0x100000000), lo = bits >>> 0;
  m[total-8]=hi>>>24; m[total-7]=(hi>>>16)&255; m[total-6]=(hi>>>8)&255; m[total-5]=hi&255;
  m[total-4]=lo>>>24; m[total-3]=(lo>>>16)&255; m[total-2]=(lo>>>8)&255; m[total-1]=lo&255;
  const h = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const w = new Uint32Array(64);
  for (let i = 0; i < total; i += 64){
    for (let t = 0; t < 16; t++) w[t] = (m[i+4*t]<<24)|(m[i+4*t+1]<<16)|(m[i+4*t+2]<<8)|m[i+4*t+3];
    for (let t = 16; t < 64; t++){
      const x = w[t-15], y = w[t-2];
      const s0 = ((x>>>7)|(x<<25)) ^ ((x>>>18)|(x<<14)) ^ (x>>>3);
      const s1 = ((y>>>17)|(y<<15)) ^ ((y>>>19)|(y<<13)) ^ (y>>>10);
      w[t] = (w[t-16] + s0 + w[t-7] + s1) >>> 0;
    }
    let a=h[0],b=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],k=h[7];
    for (let t = 0; t < 64; t++){
      const S1 = ((e>>>6)|(e<<26)) ^ ((e>>>11)|(e<<21)) ^ ((e>>>25)|(e<<7));
      const ch = (e & f) ^ (~e & g);
      const t1 = (k + S1 + ch + K256[t] + w[t]) >>> 0;
      const S0 = ((a>>>2)|(a<<30)) ^ ((a>>>13)|(a<<19)) ^ ((a>>>22)|(a<<10));
      const mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) >>> 0;
      k=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
    }
    h[0]=(h[0]+a)>>>0; h[1]=(h[1]+b)>>>0; h[2]=(h[2]+c)>>>0; h[3]=(h[3]+d)>>>0;
    h[4]=(h[4]+e)>>>0; h[5]=(h[5]+f)>>>0; h[6]=(h[6]+g)>>>0; h[7]=(h[7]+k)>>>0;
  }
  const out = new Uint8Array(32);
  for (let i = 0; i < 8; i++){ out[4*i]=h[i]>>>24; out[4*i+1]=(h[i]>>>16)&255; out[4*i+2]=(h[i]>>>8)&255; out[4*i+3]=h[i]&255; }
  return out;
}
const TE = new TextEncoder(), TD = new TextDecoder();
const hex = b => Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
const H = s => hex(sha256(TE.encode(s)));
function dechiffrer(b64, cle){
  const data = Uint8Array.from(atob(b64), c => c.charCodeAt(0)), out = new Uint8Array(data.length);
  let bloc = null;
  for (let i = 0; i < data.length; i++){
    if (i % 32 === 0) bloc = sha256(TE.encode(SEL + "|enc|" + cle + "|" + (i / 32)));
    out[i] = data[i] ^ bloc[i % 32];
  }
  return TD.decode(out);
}

/* ================= Réponses : on compare des empreintes, jamais le texte ================= */
function sansAccents(s){ return String(s == null ? "" : s).trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function norme(valeur, type){
  const s = sansAccents(valeur);
  if (type === "txt") return s.replace(/[^a-z0-9]/g, "");
  if (type === "num") { const d = s.replace(/[^0-9]/g, ""); return d.replace(/^0+(?=\d)/, ""); }
  if (type === "prix") { const t = s.replace(/[^0-9,.]/g, "").replace(",", "."); const v = parseFloat(t); if (isNaN(v)) return ""; return Number.isInteger(v) ? String(v) : v.toFixed(2); }
  if (type === "heure") { let d = s.replace(/[^0-9]/g, ""); if (!d) return ""; if (d.length <= 2) d = d.padStart(2, "0") + "00"; else if (d.length === 3) d = "0" + d; return d.slice(0, 4); }
  if (type === "heureH") { let d = s.replace(/[^0-9]/g, ""); if (d.length === 4 && d.endsWith("00")) d = d.slice(0, 2); if (d.length === 1) d = "0" + d; return d; }
  return s;
}

function ding(ok){
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = ok ? 880 : 220; g.gain.value = 0.06; o.connect(g); g.connect(audio.destination); o.start();

  } catch (e) {}
}

      </tbody></table></div>

  if (m.doc === "portes"){ let t = ""; try { t = dechiffrer(SECRETS.enc.portes, E.cleM5 || ""); } catch (e) { t = ""; } return `<div class="carte"><h3 style="font-size:24px">Journal des portes · mercredi</h3><div class="defile" style="margin-top:10px">${t}</div></div>`; }
  return "";
}
function liensRecherche(m){
  if (!m.chercher) return "";
  return `<div class="chercher">${m.chercher.map(q => `<a href="${google(q)}" target="_blank" rel="noopener"><b>Chercher</b><span>${esc(q)}</span></a>`).join("")}<p style="font-size:16px;color:var(--encre-2)">La recherche s'ouvre dans un nouvel onglet. Lis les résultats, puis reviens ici pour répondre.</p></div>`;
}
function ecranFin(){
  let frag = "";
  try { frag = dechiffrer(SECRETS.enc.fragOu, E.cleM5 || ""); } catch (e) {}
  return `<section class="page gutter"><div class="colonne">${etapes()}
    <div class="carte"><h1 style="font-size:40px;color:var(--vert)">Atelier terminé !</h1><p class="texte">Vous avez <b>${points(E)} points sur ${MAX_PTS}</b>${nbAides(E) ? ` et utilisé ${nbAides(E)} coup${nbAides(E) > 1 ? "s" : ""} de pouce (−1 point chacun)` : ""}. Écrivez-le dans votre carnet de bord.</p></div>
    ${frag}
    <p class="texte">Quand le prof le dit, cliquez sur « Accueil » pour laisser la place à la brigade suivante.</p>
  </div></section>`;
}
function ecranRapport(){
  const f = E.final;
  let corps;
  if (f && f.ok){
    let html = ""; try { html = dechiffrer(SECRETS.enc.final, f.cle); } catch (e) {}
    corps = `<div class="final">${html}<p>${BRIGADES[E.brigade]} · validé à ${f.heure}</p></div>`;
  } else {
    corps = `<form class="carte" id="form-rapport" autocomplete="off" style="display:grid;gap:14px">
      <div class="question"><label class="q" for="r-qui">1. QUI ? Son vrai nom de famille</label><div class="rang"><input id="r-qui" type="text" placeholder="un nom"></div><span id="rr-qui"></span></div>
      <div class="question"><label class="q" for="r-ou">2. OÙ ? Le numéro de sa chambre</label><div class="rang"><input id="r-ou" type="text" placeholder="un numéro"></div><span id="rr-ou"></span></div>
      <div class="question"><label class="q" for="r-quand">3. QUAND ? L'heure du rendez-vous</label><div class="rang"><input id="r-quand" type="text" placeholder="ex. : 15 h"></div><span id="rr-quand"></span></div>
      <div><button class="btn laiton" type="submit">Envoyer le rapport</button></div>
      <p style="color:var(--encre-2);font-size:16px">Essais déjà faits : ${E.finalEssais}</p></form>`;
  }
  return `<section class="page gutter"><div class="colonne"><div class="carte"><h1 style="font-size:38px;color:var(--nuit)">Rapport final</h1><p class="texte">À faire à la fin, quand ta brigade a ses 3 réponses : QUI, OÙ, QUAND.</p></div>${corps}</div></section>`;
}

/* ================= Actions ================= */
function brancher(){
  document.querySelectorAll("[data-brigade]").forEach(b => b.addEventListener("click", () => { vue.choisie = b.dataset.brigade; afficher(); }));
  const go = $("#go"); if (go) go.addEventListener("click", () => { E = tout[vue.choisie] || nouvelEtat(vue.choisie); if (!E.debut) E.debut = Date.now(); sauver(); vue.ecran = "mission"; afficher(); window.scrollTo(0, 0); });
  const gr = $("#go-rapport"); if (gr) gr.addEventListener("click", () => { E = tout[vue.choisie] || nouvelEtat(vue.choisie); sauver(); vue.ecran = "rapport"; afficher(); });
  const gp = $("#go-prof"); if (gp) gp.addEventListener("click", ouvrirProf);
  const q = $("#quitter"); if (q) q.addEventListener("click", () => { vue = { ecran:"accueil", choisie:null }; E = null; afficher(); window.scrollTo(0, 0); });
  document.querySelectorAll("form[data-q]").forEach(f => f.addEventListener("submit", ev => { ev.preventDefault(); valider(f); }));
  const a = $("#aide"); if (a) a.addEventListener("click", () => { E.aides[MISSIONS[E.etape].id] = true; sauver(); afficher(); });
  const s = $("#suite"); if (s) s.addEventListener("click", () => { if (E.etape + 1 < MISSIONS.length) E.etape += 1; else E.fini = true; sauver(); afficher(); window.scrollTo(0, 0); });
  const fl = $("#form-libre"); if (fl) fl.addEventListener("submit", ev => {
    ev.preventDefault();
    const nom = $("#l-nom").value.trim(), ch = $("#l-ch").value.trim(), prix = $("#l-prix").value.trim();
    if (!nom || !ch || !prix){ toast("Remplis les 3 cases", true); return; }
    E.libre = { nom, chambres: ch, prix }; sauver(); ding(true); toast("Bravo : +1 point"); afficher();
  });
  const fr = $("#form-rapport"); if (fr) fr.addEventListener("submit", ev => { ev.preventDefault(); validerRapport(); });
  const premier = document.querySelector(".question:not(.ok) input[type=text]"); if (premier && vue.ecran === "mission") premier.focus({ preventScroll: true });
}
function valider(form){
  const q = MISSIONS[E.etape].questions.find(x => x.id === form.dataset.q);
  let brut, aff;
  if (q.type === "qcm"){
    const c = form.querySelector("input:checked"); if (!c){ toast("Choisis une réponse", true); return; }
    brut = c.value; aff = q.choix.find(x => x[0] === brut)[1];
  } else {
    aff = form.querySelector("input").value.trim(); if (!aff){ toast("Écris une réponse", true); return; }
    brut = norme(aff, q.type);
  }
  if (bonneReponse(q.id, brut)){ E.faits[q.id] = true; E.affiche[q.id] = aff; if (q.id === "M5") E.cleM5 = brut; sauver(); ding(true); toast("Bonne réponse : +1 point"); }
  else { E.essais[q.id] = (E.essais[q.id] || 0) + 1; sauver(); ding(false); toast("Ce n'est pas ça", true); }
  afficher();
}
function candidatsQui(v){
  const s = norme(v, "txt"), out = new Set([s]);
  ["monsieur", "mr", "m"].forEach(p => { if (s.startsWith(p)) out.add(s.slice(p.length)); });
  Array.from(out).forEach(x => ["paul", "p"].forEach(p => { if (x.startsWith(p)) out.add(x.slice(p.length)); }));
  return Array.from(out).filter(Boolean);
}
function validerRapport(){
  const qui = $("#r-qui").value, ou = norme($("#r-ou").value, "num"), quand = norme($("#r-quand").value, "heureH");
  const quiOk = candidatsQui(qui).find(c => H(SEL + "|F-qui|" + c) === SECRETS.champ.qui);
  const ouOk = H(SEL + "|F-ou|" + ou) === SECRETS.champ.ou;
  const quandOk = H(SEL + "|F-quand|" + quand) === SECRETS.champ.quand;
  E.finalEssais += 1;
  if (quiOk && ouOk && quandOk){
    const cle = quiOk + "|" + ou + "|" + quand;
    if (H(SEL + "|final|" + cle) === SECRETS.final){
      E.final = { ok:true, cle, heure: new Date().toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" }) };
      sauver(); ding(true); afficher(); return;
    }
  }
  sauver(); ding(false);
  const marque = (id, ok) => { const el = $(id); el.textContent = ok ? "✓ Juste" : "✗ Pas encore"; el.className = ok ? "bravo-q" : "non"; };
  marque("#rr-qui", !!quiOk); marque("#rr-ou", ouOk); marque("#rr-quand", quandOk);
  toast("Pas encore : corrige les lignes en rouge", true);
}

/* ================= Chronomètre ================= */
function majChrono(){
  const el = $("#chrono"); if (!el || !E || !E.debut) return;
  const reste = Math.round((tout.reglages.duree * 60000 - (Date.now() - E.debut)) / 1000);
  if (reste <= 0){ el.textContent = "Temps écoulé"; el.classList.add("fin"); return; }
  el.textContent = String(Math.floor(reste / 60)).padStart(2, "0") + ":" + String(reste % 60).padStart(2, "0");
  el.classList.toggle("fin", reste < 300);
}
setInterval(majChrono, 1000);

/* ================= Espace prof ================= */
function fermer(){ $("#modal").hidden = true; }
function ouvrirProf(){
  $("#modal-box").innerHTML = `<h2 id="modal-titre">Espace prof</h2>
    <form id="form-pin" autocomplete="off" style="display:flex;gap:8px;flex-wrap:wrap"><label for="pin" style="width:100%">Code prof</label><input id="pin" type="password" inputmode="numeric" style="flex:1;min-width:140px;border:2px solid var(--trait);border-radius:8px;padding:8px 10px"><button class="btn petit" type="submit">Entrer</button><span class="non" id="pin-err"></span></form>
    <button class="btn petit contour" id="fermer">Fermer</button>`;
  $("#modal").hidden = false; $("#pin").focus();
  $("#fermer").addEventListener("click", fermer);
  $("#form-pin").addEventListener("submit", ev => { ev.preventDefault(); if (bonneReponse("PIN", norme($("#pin").value, "num"))) panneauProf(); else $("#pin-err").textContent = "Code incorrect."; });
}
function panneauProf(confirmer){
  const lignes = Object.keys(BRIGADES).map(k => {
    const e = tout[k];
    if (!e) return `<tr><td>${BRIGADES[k]}</td><td colspan="4">pas encore jouée sur cet ordinateur</td><td></td></tr>`;
    return `<tr><td>${BRIGADES[k]}</td><td><b>${points(e)}</b> / ${MAX_PTS}</td><td>${nbAides(e)}</td><td>${e.libre ? esc(e.libre.nom + " · " + e.libre.chambres + " ch. · " + e.libre.prix) : "—"}</td><td>${e.final && e.final.ok ? "validé à " + e.final.heure : e.finalEssais ? e.finalEssais + " essai(s)" : "—"}</td><td><button class="lien" data-raz="${k}">Remettre à zéro</button></td></tr>`;
  }).join("");
  $("#modal-box").innerHTML = `<h2 id="modal-titre">Espace prof</h2>
    <p>Scores enregistrés sur cet ordinateur. Coups de pouce : −1 point chacun.</p>
    <div class="defile"><table><thead><tr><th>Brigade</th><th>Points</th><th>Coups de pouce</th><th>Mission 7 (vrai hôtel)</th><th>Rapport final</th><th></th></tr></thead><tbody>${lignes}</tbody></table></div>
    <label for="duree">Durée de l'atelier : <select id="duree" style="border:2px solid var(--trait);border-radius:8px;padding:6px">${[25, 30, 35, 40, 45].map(d => `<option value="${d}" ${tout.reglages.duree === d ? "selected" : ""}>${d} minutes</option>`).join("")}</select></label>
    ${confirmer ? `<div class="aide">Effacer la partie de la ${BRIGADES[confirmer]} sur cet ordinateur ? <button class="btn petit" id="oui">Oui, effacer</button> <button class="btn petit contour" id="non">Annuler</button></div>` : ""}
    <button class="btn petit contour" id="fermer">Fermer</button>`;
  $("#fermer").addEventListener("click", () => { fermer(); afficher(); });
  $("#duree").addEventListener("change", ev => { tout.reglages.duree = Number(ev.target.value); ecrireTout(tout); majChrono(); });
  document.querySelectorAll("[data-raz]").forEach(b => b.addEventListener("click", () => panneauProf(b.dataset.raz)));
  if (confirmer){
    $("#oui").addEventListener("click", () => { delete tout[confirmer]; ecrireTout(tout); if (E && E.brigade === confirmer){ E = null; vue = { ecran:"accueil", choisie:null }; } panneauProf(); });
    $("#non").addEventListener("click", () => panneauProf());
  }
}
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !$("#modal").hidden){ fermer(); afficher(); } });

afficher();
</script>
